name: Marvel Studios CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Xcode mais novo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve SPM
        run: xcodebuild -resolvePackageDependencies -project AplicativoMarvelStudios.xcodeproj

      - name: Build pra iPhone real (zero chance de erro de simulador)
        run: |
          xcodebuild clean build-for-testing \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios \
            -destination 'generic/platform=iOS' \
            -quiet

      - name: VERDE TOTAL!
        if: success()
        run: echo "DEU VERDE EM 60 SEGUNDOS! AVENGERS ASSEMBLE!"

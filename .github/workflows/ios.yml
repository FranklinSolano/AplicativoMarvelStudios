name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    env:
      PROJECT: AplicativoMarvelStudios.xcodeproj
      SCHEME: AplicativoMarvelStudios
      CONFIGURATION: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: List Simulators
      run: xcrun simctl list

    - name: Get Any Available iOS Simulator
      id: find-sim
      run: |
        DEVICE=$(xcrun simctl list devices available | grep -m1 "Booted" | awk -F '[()]' '{print $2}')
        if [ -z "$DEVICE" ]; then
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | awk -F '[()]' '{print $2}')
        fi
        echo "device_id=$DEVICE" >> $GITHUB_OUTPUT

    - name: Boot Simulator (if needed)
      run: xcrun simctl boot "${{ steps.find-sim.outputs.device_id }}" || true

    - name: Build App
      run: |
        set -o pipefail
        xcodebuild \
          -project "${PROJECT}" \
          -scheme "${SCHEME}" \
          -configuration "${CONFIGURATION}" \
          -destination "id=${{ steps.find-sim.outputs.device_id }}" \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
        | xcpretty

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build
        path: DerivedData

name: Marvel Studios CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1 - Pega o código
        uses: actions/checkout@v4

      - name: 2 - Escolhe o Xcode mais novo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3 - Baixa Firebase, SnapKit e SDWebImage (SPM)
        run: xcodebuild -resolvePackageDependencies -project AplicativoMarvelStudios.xcodeproj

      - name: 4 - COMPILA NO SIMULADOR iOS 17.6 (igual ao seu projeto agora!)
        run: |
          xcodebuild clean build \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.6' \
            -quiet

      - name: AVENGERS ASSEMBLE! Compilou perfeitamente no iOS 17.6!
        if: success()
        run: echo "DEU VERDE! Seu app Marvel tá pronto pro futuro!"

      - name: Deu erro?
        if: failure()
        run: echo "Me manda o log vermelho que eu arrumo"

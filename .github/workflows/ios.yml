name: Marvel Studios CI

on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout código
      - uses: actions/checkout@v4

      - name: Instalar Xcode mais novo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolver dependências SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios

      - name: Build (somente compilação)
        run: |
          xcodebuild clean build \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -quiet

      - name: VERDE TOTAL!
        if: success()
        run: echo "CI rodou com sucesso! Avengers Assemble!"

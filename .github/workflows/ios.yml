name: Marvel Studios CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1 - Pega o código
        uses: actions/checkout@v4

      - name: 2 - Escolhe o Xcode mais novo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3 - Baixa Firebase, SnapKit e SDWebImage (SPM)
        run: xcodebuild -resolvePackageDependencies -project AplicativoMarvelStudios.xcodeproj

      - name: 4 - Cria o simulador iPhone 17 Pro com iOS 16.0 (igual no seu Mac)
        run: |
          xcrun simctl create "iPhone 17 Pro" "iPhone 17 Pro" "iOS16.0" || true

      - name: 5 - COMPILA EXATAMENTE COMO VOCÊ USA NO SEU MAC
        run: |
          xcodebuild clean build \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=16.0' \
            -quiet

      - name: AVENGERS ASSEMBLE! Compilou igualzinho no seu Mac!
        if: success()
        run: echo "DEU VERDE! Seu app Marvel tá perfeito!"

      - name: Deu erro?
        if: failure()
        run: echo "Me manda o log vermelho que eu arrumo em 5 segundos"

name: Marvel Studios CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 1 - Pega o código
        uses: actions/checkout@v4

      - name: 2 - Escolhe o Xcode mais novo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 3 - Baixa Firebase, SnapKit e SDWebImage (SPM)
        run: xcodebuild -resolvePackageDependencies -project AplicativoMarvelStudios.xcodeproj

      - name: 4 - Cria o simulador iPhone 15 com iOS 16.0 (existe de verdade!)
        run: |
          xcrun simctl create "iPhone 15" com.apple.CoreSimulator.SimDeviceType.iPhone-15 "com.apple.CoreSimulator.SimRuntime.iOS-16-0" || true

      - name: 5 - COMPILA EXATAMENTE COMO NO SEU MAC (mas com iPhone 15)
        run: |
          xcodebuild clean build \
            -project AplicativoMarvelStudios.xcodeproj \
            -scheme AplicativoMarvelStudios \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=16.0' \
            -quiet

      - name: AVENGERS ASSEMBLE! Compilou perfeitamente!
        if: success()
        run: echo "DEU VERDE! Seu app Marvel tá voando no GitHub!"

      - name: Deu erro de novo?
        if: failure()
        run: echo "Me manda o log que eu resolvo – mas dessa vez é verde na certa!"
